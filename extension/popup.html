<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Passport</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <span class="brand">🔐 Passport</span>
    <div class="head-actions">
      <button id="lock" class="icon-button" type="button" title="ロックする" hidden>🔒</button>
      <button id="settings" class="icon-button" type="button" title="設定">⚙️</button>
    </div>
  </header>

  <!-- サーバー未設定 -->
  <section id="view-setup" hidden>
    <p class="hint">まず Passport サーバーの場所を教えてください。</p>
    <button id="open-options" class="button primary" type="button">設定を開く</button>
  </section>

  <!-- ログイン -->
  <section id="view-login" hidden>
    <form id="login-form" autocomplete="off">
      <label for="username">ユーザー名</label>
      <input id="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label for="password">パスワード</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <p id="login-error" class="error" hidden></p>
      <button class="button primary" type="submit">ログイン</button>
    </form>
    <p class="hint small" id="server-label"></p>
  </section>

  <!-- 本体 -->
  <section id="view-main" hidden>
    <!-- 検索 -->
    <div class="search-wrap">
      <input id="search" type="search" placeholder="すべての金庫から探す" autocomplete="off">
      <button id="clear-search" class="icon-button subtle" type="button" title="このページに戻る" hidden>×</button>
    </div>

    <!-- このページ -->
    <div id="page-section">
      <div class="section-head">
        <span class="section-title">このページ</span>
        <span id="site-host" class="section-note">—</span>
      </div>

      <ul id="page-items" class="items"></ul>

      <p id="page-empty" class="hint small" hidden></p>

      <!-- インラインメニューの許可 -->
      <div id="inline-offer" class="offer" hidden>
        <div>
          <strong class="offer-title">入力欄のそばにメニューを出す</strong>
          <span class="offer-note">このサイトを開いたとき、入力欄を選ぶと候補が出るようになります</span>
        </div>
        <button id="enable-inline" class="button small primary" type="button">有効にする</button>
      </div>
      <p id="inline-on" class="hint small" hidden>✓ このサイトでは入力欄のそばにメニューが出ます</p>
    </div>

    <!-- 検索結果 -->
    <div id="search-section" hidden>
      <div class="section-head">
        <span class="section-title">検索結果</span>
        <span id="search-count" class="section-note"></span>
      </div>
      <ul id="search-items" class="items"></ul>
      <p id="search-empty" class="hint small" hidden>見つかりませんでした</p>
    </div>

    <p id="main-error" class="error" hidden></p>
  </section>

  <footer class="foot">
    <span id="status" class="status"></span>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
