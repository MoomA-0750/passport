<!-- ユーザー追加 -->
<div class="modal fade" id="user-modal" tabindex="-1">
  <div class="modal-dialog">
    <form class="modal-content" id="user-form" autocomplete="off">
      <div class="modal-header">
        <h5 class="modal-title">ユーザーを追加</h5>
        <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="閉じる"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label" for="new-username">ユーザー名 <span class="text-danger">*</span></label>
          <input class="form-control" id="new-username" required
                 autocapitalize="none" autocorrect="off" spellcheck="false"
                 pattern="[a-z0-9][a-z0-9._-]{1,31}">
        </div>
        <div class="mb-3">
          <label class="form-label" for="new-displayname">表示名</label>
          <input class="form-control" id="new-displayname">
        </div>
        <div class="mb-3">
          <label class="form-label" for="new-role">権限</label>
          <select class="form-select" id="new-role">
            <option value="member">member</option>
            <option value="admin">admin（ユーザー管理と監査ログを見られる）</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label" for="new-password">初期パスワード <span class="text-danger">*</span></label>
          <div class="input-group">
            <input class="form-control font-monospace" id="new-password" required>
            <button class="btn btn-outline-secondary" type="button" data-action="generate-initial">生成</button>
          </div>
          <div class="form-text">本人が初回ログイン時に変更します</div>
        </div>
        <div class="alert alert-danger d-none" id="user-error"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">キャンセル</button>
        <button class="btn btn-primary" type="submit">追加</button>
      </div>
    </form>
  </div>
</div>
